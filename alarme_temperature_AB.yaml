blueprint:
  name: Alarme température avec seuils et temporisation
  description: >
    Déclenche un script lorsque la température passe sous le seuil minimum,
    au-dessus du seuil maximum ou lorsque le capteur devient indisponible.
  domain: automation

  input:
    temperature_sensor:
      name: Capteur de température
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

    min_temperature:
      name: Seuil minimum
      selector:
        entity:
          filter:
            - domain: input_number

    max_temperature:
      name: Seuil maximum
      selector:
        entity:
          filter:
            - domain: input_number

    tps_min:
      name: Temporisation alarme basse
      description: "Durée en minutes"
      selector:
        entity:
          filter:
            - domain: input_number

    tps_max:
      name: Temporisation alarme haute
      description: "Durée en minutes"
      selector:
        entity:
          filter:
            - domain: input_number

    notification_script:
      name: Script de notification
      description: "Script à exécuter en cas d'alarme"
      selector:
        entity:
          filter:
            - domain: script

variables:
  temperature_sensor: !input temperature_sensor
  min_temperature: !input min_temperature
  max_temperature: !input max_temperature
  tps_min: !input tps_min
  tps_max: !input tps_max

triggers:
  - trigger: temperature.changed
    target:
      entity_id: !input temperature_sensor
    options:
      threshold:
        type: above
        value:
          entity: !input max_temperature
    id: max

  - trigger: temperature.changed
    target:
      entity_id: !input temperature_sensor
    options:
      threshold:
        type: below
        value:
          entity: !input min_temperature
    id: min

  - trigger: state
    entity_id: !input temperature_sensor
    to: "unavailable"
    id: unavailable

conditions: []

actions:
  - choose:

      # ==========================================================
      # TEMPÉRATURE TROP BASSE
      # ==========================================================
      - conditions:
          - condition: trigger
            id: min

        sequence:
          - action: script.turn_on
            target:
              entity_id: !input notification_script

          - wait_template: >
              {{
                states(temperature_sensor) == 'unavailable'
                or
                states(temperature_sensor) | float(0)
                >=
                states(min_temperature) | float(0)
              }}
            timeout:
              hours: 0
              minutes: "{{ states(tps_min) | int(0) }}"
              seconds: 0
              milliseconds: 0
            continue_on_timeout: false

          # Si l'attente s'est terminée parce que le capteur
          # est devenu indisponible, on déclenche à nouveau l'alarme.
          - if:
              - condition: template
                value_template: >
                  {{ states(temperature_sensor) == 'unavailable' }}
            then:
              - action: script.turn_on
                target:
                  entity_id: !input notification_script


      # ==========================================================
      # TEMPÉRATURE TROP HAUTE
      # ==========================================================
      - conditions:
          - condition: trigger
            id: max

        sequence:
          - action: script.turn_on
            target:
              entity_id: !input notification_script

          - wait_template: >
              {{
                states(temperature_sensor) == 'unavailable'
                or
                states(temperature_sensor) | float(0)
                <=
                states(max_temperature) | float(0)
              }}
            timeout:
              hours: 0
              minutes: "{{ states(tps_max) | int(0) }}"
              seconds: 0
              milliseconds: 0
            continue_on_timeout: false

          # Si l'attente s'est terminée parce que le capteur
          # est devenu indisponible, on déclenche à nouveau l'alarme.
          - if:
              - condition: template
                value_template: >
                  {{ states(temperature_sensor) == 'unavailable' }}
            then:
              - action: script.turn_on
                target:
                  entity_id: !input notification_script


      # ==========================================================
      # CAPTEUR INDISPONIBLE
      # ==========================================================
      - conditions:
          - condition: trigger
            id: unavailable

        sequence:
          - action: script.turn_on
            target:
              entity_id: !input notification_script

mode: single
max_exceeded: silent
